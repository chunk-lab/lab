<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>チャンクタウン</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 街：一枚絵を横幅に合わせて表示。建物は絵の区画に％で置く。アプリは全画面の #ctApp の中に mount する */
:root{--sky:#069bfd;--ink:#2b2320;--paper:#fffaf0;--wood:#8a5a32;--leaf:#4fa34a;--sun:#ffc93c;
  --font:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","M PLUS Rounded 1c","Yu Gothic",system-ui,sans-serif;color-scheme:light}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
[hidden]{display:none!important}
.ct-view{position:fixed;inset:0;overflow:hidden}
.ct-map{position:absolute;left:0;top:0;width:100%;aspect-ratio:941/1672;background:url(img/bg.webp) center/100% 100% no-repeat}
.ct-bld{position:absolute;transform:translate(-50%,-100%);background:none;border:0;padding:0;cursor:pointer;filter:drop-shadow(0 6px 6px rgba(40,60,20,.35));transition:transform .15s}
.ct-bld img{width:100%;display:block;pointer-events:none}
.ct-bld:active{transform:translate(-50%,-100%) scale(.94)}
.ct-bld.hop{animation:cthop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes cthop{35%{transform:translate(-50%,-104%) scale(1.06,.95)}}
.ct-bld:focus-visible{outline:3px solid var(--sun);outline-offset:4px;border-radius:12px}
#bSchool{left:22.8%;top:45.4%;width:32%}
#bLibrary{left:77.8%;top:45.4%;width:31%}
#bHouse{left:50.2%;top:58.6%;width:24%}
#bShop{left:20.6%;top:78.6%;width:34%}
#bGame{left:80.2%;top:78.6%;width:31%}
@media (prefers-reduced-motion:reduce){.ct-bld.hop{animation:none}}
.ct-ov{position:fixed;inset:0;background:rgba(20,30,40,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.ct-sheet{width:min(100%,520px);background:var(--paper);border-radius:22px 22px 0 0;border:3px solid var(--wood);border-bottom:0;
  padding:16px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px;animation:ctup .25s ease-out;max-height:80vh;overflow-y:auto}
@keyframes ctup{from{transform:translateY(100%)}}
.ct-sheet header{display:flex;align-items:center;gap:12px}
.ct-sheet header img{width:72px}
.ct-sheet h2{margin:0;font-size:22px}
.ct-sheet header p{margin:2px 0 0;font-size:13px;color:#6b5a4c}
.ct-sheet ul{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ct-sheet li button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:#fff;border:2px solid var(--leaf);box-shadow:0 3px 0 var(--leaf);color:var(--ink);font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.ct-sheet small{font-weight:500;font-size:12px;color:#8a7766}
.ct-close{padding:12px;border-radius:14px;border:2px solid var(--wood);background:var(--sun);font:inherit;font-weight:800;font-size:15px;color:var(--ink);box-shadow:0 3px 0 var(--wood);cursor:pointer}
.ct-note{font-size:13px;color:#8a7766;margin:0}
/* アプリの表示場所 */
.ct-app{position:fixed;inset:0;z-index:20;background:#0b1626}
.ct-mount{position:absolute;inset:0;overflow:hidden}
.ct-mount iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ct-back{position:fixed;z-index:30;left:max(8px,env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:6px 12px;border-radius:999px;border:2px solid var(--wood);background:var(--paper);font:inherit;font-weight:800;font-size:13px;color:var(--ink);box-shadow:0 2px 0 var(--wood);opacity:.92;cursor:pointer}
.ct-err{color:#fff;padding:24px;text-align:center}

</style>
<div class="ct-view"><div class="ct-map" id="ctMap">
  <button class="ct-bld" id="bSchool" data-k="school"><img src="img/school.webp" alt="学校"></button>
  <button class="ct-bld" id="bLibrary" data-k="library"><img src="img/library.webp" alt="図書館"></button>
  <button class="ct-bld" id="bHouse" data-k="house"><img src="img/house.webp" alt="自宅"></button>
  <button class="ct-bld" id="bShop" data-k="shop"><img src="img/supermarket.webp" alt="ショップ"></button>
  <button class="ct-bld" id="bGame" data-k="game"><img src="img/gamecenter.webp" alt="ゲームセンター"></button>
</div></div>
<div class="ct-ov" id="ctOv" hidden></div>
<div class="ct-app" id="ctApp" hidden></div>
<button class="ct-back" id="ctBack" hidden>🏠 街へ</button>
<script>/* ===== チャンクタウン：土台（全アプリ共通のしくみ） =====
 ここにあるもの
  ・アプリの登録と開け閉め（ChunkTown.register / open / close）
  ・セーブデータ（ChunkTown.storage(名前)）… アプリごとに分かれた保存場所。キーは "ct:<アプリ>:<キー>"
  ・共通の設定（ChunkTown.settings）… 音量・読み上げ。全アプリで同じものを使う
  ・読み上げ（ChunkTown.speak）
 これから入れるもの（中身を決めてから）：プロフィール・アバター、コイン・ダイヤ、レベル・課題、ショップ、ランキング

 アプリのつなぎ方（apps/adapters/*.js）
  ChunkTown.register({
    id:"punichunk", name:"ぷにチャンク",
    scripts:["apps/punichunk.js"],          // 最初に開くときに読み込むファイル
    mount(el, ctx){ ...; return { unmount(){...} } }
  });
  ctx = { storage, settings, speak, showBack(true/false), exit() }
*/
(function () {
  'use strict';
  var KEY = 'ct:';
  function storage(ns) {
    var p = KEY + ns + ':';
    return {
      get: function (k) { try { var v = localStorage.getItem(p + k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem(p + k, JSON.stringify(v)); } catch (e) { } },
      remove: function (k) { try { localStorage.removeItem(p + k); } catch (e) { } }
    };
  }
  var core = storage('core');
  var settings = Object.assign({ bgm: 0.5, sfx: 0.8, voice: true, rate: 1 }, core.get('settings') || {});
  function saveSettings() { core.set('settings', settings); }

  var voice = null;
  function pickVoice() { try { var vs = speechSynthesis.getVoices() || [], en = vs.filter(function (v) { return /^en[-_]?/i.test(v.lang || ''); }); voice = en.find(function (v) { return /US/i.test(v.lang); }) || en[0] || null; } catch (e) { } }
  try { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) { }
  function speak(t) { if (!settings.voice) return; try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; if (voice) u.voice = voice; u.rate = settings.rate; speechSynthesis.speak(u); } catch (e) { } }

  var loaded = {};
  function loadScript(src) {
    if (loaded[src]) return loaded[src];
    return (loaded[src] = new Promise(function (ok, ng) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { delete loaded[src]; ng(new Error(src)); }; document.head.appendChild(s); }));
  }

  var apps = {}, cur = null;
  var CT = window.ChunkTown = {
    storage: storage, settings: settings, saveSettings: saveSettings, speak: speak, apps: apps,
    register: function (a) { apps[a.id] = a; },
    open: function (id, opts) {
      var a = apps[id]; if (!a || cur) return;
      var view = document.getElementById('ctApp'), back = document.getElementById('ctBack'), el = document.createElement('div');
      el.className = 'ct-mount'; view.appendChild(el); view.hidden = false; back.hidden = true;
      document.body.classList.add('ct-in-app');
      var ctx = { storage: storage(id), settings: settings, speak: speak, opts: opts || {}, exit: CT.close,
        showBack: function (on) { back.hidden = !on; } };
      cur = { id: id, el: el, inst: null };
      (a.scripts || []).reduce(function (p, s) { return p.then(function () { return loadScript(s); }); }, Promise.resolve())
        .then(function () { if (cur && cur.el === el) cur.inst = a.mount(el, ctx) || {}; })
        .catch(function (e) { el.innerHTML = '<p class="ct-err">読み込めませんでした（' + e.message + '）</p>'; back.hidden = false; });
    },
    close: function () {
      if (!cur) return; var c = cur; cur = null;
      try { c.inst && c.inst.unmount && c.inst.unmount(); } catch (e) { }
      try { speechSynthesis.cancel(); } catch (e) { }
      c.el.remove(); document.getElementById('ctApp').hidden = true; document.getElementById('ctBack').hidden = true;
      document.body.classList.remove('ct-in-app');
    }
  };
  document.addEventListener('DOMContentLoaded', function () { document.getElementById('ctBack').onclick = CT.close; });
})();

/* ===== チャンクタウン：街の画面（一枚絵・建物・施設のメニュー） =====
 施設の中身は PLACES を書きかえる。app はアダプタ（apps/adapters）で登録した id */
(function () {
  'use strict';
  var PLACES = {
    school: { n: '学校', img: 'school', sub: 'チャンクチャンクで学ぶ', items: [{ t: 'チャンクチャンク（スタディ）', app: 'chunkchunk', opts: { go: 'study' } }] },
    library: { n: '図書館', img: 'library', sub: '読む・調べる', items: [{ t: 'リーディング（チャンクチャンク）', app: 'chunkchunk', opts: { go: 'study' } }] },
    house: { n: '自宅', img: 'house', sub: 'アバター・マイページ', items: [{ t: 'アバター・マイページ', app: 'chunkchunk', opts: { go: 'avatar' } }] },
    shop: { n: 'ショップ', img: 'supermarket', sub: '有料コンテンツ', items: [] },
    game: { n: 'ゲームセンター', img: 'gamecenter', sub: '遊んで鍛える', items: [
      { t: 'チャンクストリーム', app: 'stream' },
      { t: 'ぷにチャンク', app: 'punichunk' },
      { t: 'チャンク・カード', app: 'cards' },
      { t: 'チャンクチャンク（ゲーム）', app: 'chunkchunk', opts: { go: 'game' } }] }
  };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function fit() { var m = $('ctMap'), vh = innerHeight, mh = m.offsetHeight; m.style.top = (mh <= vh ? vh - mh : Math.min(0, Math.max(vh - mh, vh / 2 - mh * .48))) + 'px'; }
  function sheet(k) {
    var p = PLACES[k], ov = $('ctOv');
    if (p.items.length === 1) { ChunkTown.open(p.items[0].app, p.items[0].opts); return; }
    ov.innerHTML = '<div class="ct-sheet" role="dialog" aria-label="' + esc(p.n) + '"><header><img src="img/' + p.img + '.webp" alt=""><div><h2>' + esc(p.n) + '</h2><p>' + esc(p.sub) + '</p></div></header>' +
      (p.items.length ? '<ul>' + p.items.map(function (it, i) { return '<li><button data-i="' + i + '">' + esc(it.t) + '<small>入る ›</small></button></li>'; }).join('') + '</ul>' : '<p class="ct-note">売っているものは、まだありません。</p>') +
      '<button class="ct-close" id="ctCl">街にもどる</button></div>';
    ov.hidden = false;
    $('ctCl').onclick = close;
    ov.querySelectorAll('button[data-i]').forEach(function (b) { b.onclick = function () { var it = p.items[+b.dataset.i]; close(); ChunkTown.open(it.app, it.opts); }; });
  }
  function close() { var ov = $('ctOv'); ov.hidden = true; ov.innerHTML = ''; }
  document.addEventListener('DOMContentLoaded', function () {
    addEventListener('resize', fit); fit();
    $('ctOv').addEventListener('click', function (e) { if (e.target === $('ctOv')) close(); });
    document.querySelectorAll('.ct-bld').forEach(function (b) {
      b.addEventListener('click', function () { b.classList.remove('hop'); void b.offsetWidth; b.classList.add('hop'); setTimeout(function () { sheet(b.dataset.k); }, 260); });
    });
  });
})();

/* チャンク・カード（apps/cb/cards）。判定・辞書はぷにチャンクの部品を使うので、punichunk.js を先に読む。
   見た目（CSS）は build.py が .ct-cards の中だけに効くように直して cards.js に入れる */
ChunkTown.register({
  id: 'cards', name: 'チャンク・カード', scripts: ['apps/punichunk.js', 'apps/cards.js'],
  mount: function (el, ctx) {
    el.classList.add('ct-cards');
    var root = document.createElement('div'); root.className = 'cc-app'; el.appendChild(root);
    window.ChunkCards.mount(root);
    // タイトル画面（「はじめる」ボタンがある画面）のときだけ「街へ」を出す
    var mo = new MutationObserver(function () { ctx.showBack(!!root.querySelector('#go')); });
    mo.observe(root, { childList: true, subtree: true }); ctx.showBack(true);
    return { unmount: function () { mo.disconnect(); root.remove(); } };
  }
});

/* いまはまだ部品になっていないアプリ（ステップ2・3で、ほかと同じ組み込み口に作り直す）
   ・チャンクストリーム … /home/claude/game（長文ゲーム）のビルド結果を apps/stream/ に入れて表示
   ・チャンクチャンク …… apps/chunkchunk/（?go=study|game|avatar で開く画面を指定） */
['stream', 'chunkchunk'].forEach(function (id) {
  ChunkTown.register({
    id: id, name: id,
    mount: function (el, ctx) {
      var f = document.createElement('iframe'), go = ctx.opts.go;
      f.src = 'apps/' + id + '/index.html' + (go ? '?go=' + go : ''); f.allow = 'fullscreen; autoplay';
      el.appendChild(f); ctx.showBack(true);
      return { unmount: function () { f.src = 'about:blank'; } };
    }
  });
});

/* ぷにチャンク（apps/cb/src → apps/cb/build.py → punichunk.js）。組み込み口 PuniChunk.mount をそのまま使う */
ChunkTown.register({
  id: 'punichunk', name: 'ぷにチャンク', scripts: ['apps/punichunk.js'],
  mount: function (el, ctx) {
    var s = ctx.settings;
    var g = PuniChunk.mount(el, {
      startScreen: 'title', storage: ctx.storage,
      audio: { bgm: s.bgm, sfx: s.sfx, voice: s.voice, rate: s.rate },
      onEvent: function (n, d) { if (n === 'screen') ctx.showBack(d.name === 'title' || d.name === 'modes' || d.name === 'splash'); }
    });
    ctx.showBack(true);
    return { unmount: function () { g.unmount(); } };
  }
});
</script>

</body></html>
