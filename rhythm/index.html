<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>チャンクリズム 試作</title>
<style>
:root{--bg:#0f1b2d;--panel:#172a45;--line:#2d4a72;--ink:#eef2f7;--sub:#8ea3bf;--acc:#ffb23e;--good:#5fd38d;--bad:#ff6b6b;--blue:#5ab0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,18,32,.92);overflow:auto;touch-action:pan-y}
.ov[hidden]{display:none}
.card{width:min(600px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;max-height:100%;overflow:auto}
h1{font-size:22px;margin:0 0 2px}h1 small{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.lead{color:var(--sub);font-size:13px;margin:0 0 12px}.lead a{color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 12px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
select,input[type=range]{width:100%}
select{background:#0f1b2d;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.modes button{background:#0f1b2d;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-size:13px;line-height:1.3}
.modes button small{display:block;color:var(--sub);font-size:11px}
.modes button.on{border-color:var(--acc);background:#3a2a10}
.modes button.on small{color:#ffd9a0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;background:var(--acc);color:#1b1206;margin-top:14px}
.btn:disabled{opacity:.45}
.btn.sub{background:#24406a;color:var(--ink);font-size:15px;padding:11px;margin-top:8px}
.st{font-size:13px;color:var(--sub);margin-top:8px;min-height:1.5em}
.bar{height:6px;background:#0f1b2d;border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.how{font-size:12.5px;color:var(--sub);background:#0f1b2d;border-radius:12px;padding:10px 12px;margin-top:12px}
.how b{color:var(--acc)}
.res h2{margin:0;font-size:15px;color:var(--sub);font-weight:400}
.rank{font-size:56px;font-weight:900;color:var(--acc);line-height:1;margin:4px 0}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0}
.rgrid div{background:#0f1b2d;border-radius:10px;padding:6px 2px}.rgrid b{display:block;font-size:20px}.rgrid span{font-size:11px;color:var(--sub)}
.bad{color:var(--bad)}.good{color:var(--good)}
.ofsrow{display:flex;gap:8px;align-items:end}.ofsrow>div{flex:1}.ofsrow button{flex:none;width:auto;margin:0;padding:8px 12px;font-size:13px;border-radius:10px;border:0;background:#24406a;color:var(--ink)}
#calPad{width:100%;height:150px;border-radius:16px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--sub);margin-top:10px}
#calPad.hit{background:#3a2a10;color:var(--acc)}
#chara{position:fixed;right:-240px;bottom:0;width:150px;transition:right .25s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#chara.on{right:6px}
#chara img{width:100%;display:block}
#chara .bub{position:absolute;top:-6px;left:-40px;background:#fff;color:#c2410c;font-weight:900;font-size:18px;padding:4px 10px;border-radius:14px;white-space:nowrap;transform:rotate(-6deg)}
@media (max-height:520px){.card{padding:12px 16px}.rank{font-size:40px}.rgrid{margin:6px 0}.rgrid b{font-size:17px}.btn{padding:10px;margin-top:8px;font-size:16px}.btn.sub{padding:8px}.lead{margin-bottom:8px}.how{margin-top:8px}}
#quit{position:fixed;top:8px;right:8px;background:rgba(36,64,106,.8);color:var(--ink);border:0;border-radius:10px;padding:6px 12px;font-size:13px}
#quit[hidden]{display:none}
</style>
</head>
<body>
<script>
// 全コアで計算できるように1回だけ再読み込み（声を作る速さのため）
if (!window.crossOriginIsolated && 'serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('./coi-sw.js').then(() => navigator.serviceWorker.ready).then(() => {
    try { if (!sessionStorage.getItem('coi')) { sessionStorage.setItem('coi', '1'); location.reload(); } } catch (e) {}
  }).catch(() => {});
}
</script>
<script src="../stream/data.js"></script>
<script src="common.js"></script>

<canvas id="cv"></canvas>
<div id="chara"><div class="bub" id="bub"></div><img id="charaImg" alt=""></div>
<button id="quit" hidden>やめる</button>

<div class="ov" id="setup">
  <div class="card">
    <h1>チャンクリズム<small>試作</small></h1>
    <p class="lead">英文の声に合わせて叩くリズムゲームの試作です。遊び方を比べてください。<a href="check.html">タイミング確認ページ</a></p>
    <div class="grid">
      <div class="full"><label>遊び方</label><div class="modes" id="modes">
        <button data-m="con">意味語<small>大事な単語を叩く</small></button>
        <button data-m="fill">長押し<small>＋タタタン</small></button>
        <button data-m="mix">ミックス<small>意味語＋タタタン</small></button>
        <button data-m="rec">譜面作り<small>自分で叩いて作る</small></button>
      </div></div>
      <div class="full"><label for="psg">文章（最初の12チャンク）</label><select id="psg"></select></div>
      <div><label for="flow">流れる速さ</label><select id="flow"><option value="1">×1</option><option value="1.5">×1.5</option><option value="2">×2</option><option value="2.5">×2.5</option><option value="3">×3</option></select></div>
      <div><label for="bpm">テンポ</label><select id="bpm"><option value="80">80</option><option value="90">90</option><option value="100">100</option><option value="110">110</option><option value="125">125</option></select></div>
      <div><label for="voice">声</label><select id="voice">
        <option value="af_heart">女性（米）1</option><option value="af_bella">女性（米）2</option>
        <option value="am_michael">男性（米）</option><option value="bf_emma">女性（英）</option><option value="bm_george">男性（英）</option></select></div>
      <div class="full ofsrow"><div><label for="ofs">タイミング補正：<span id="ofsv">0</span>ms</label><input type="range" id="ofs" min="-250" max="250" step="10" value="0"></div><button id="bCal">自動で測る</button></div>
    </div>
    <button class="btn" id="bPrep">準備してスタート</button>
    <div class="bar"><i id="pbar"></i></div>
    <div class="st" id="pst"></div>
    <div class="how" id="how"></div>
  </div>
</div>

<div class="ov" id="cal" hidden>
  <div class="card" style="text-align:center">
    <h1>タイミング測定</h1>
    <p class="lead" id="calLead">「ピッ」という音に合わせて、下の枠を8回叩いてください。</p>
    <div id="calPad">ここを叩く</div>
    <div class="st" id="calSt"></div>
    <button class="btn" id="bCalGo">はじめる</button>
    <button class="btn sub" id="bCalBack">戻る</button>
  </div>
</div>

<div class="ov" id="ready" hidden>
  <div class="card" style="text-align:center">
    <h1>準備OK</h1>
    <p class="lead" id="readyLead">音を出せる状態にして、スタートを押してください。</p>
    <button class="btn" id="bStart">スタート！</button>
    <button class="btn sub" id="bBack1">戻る</button>
  </div>
</div>

<div class="ov" id="result" hidden>
  <div class="card res" style="text-align:center">
    <h2 id="rMode">結果</h2>
    <div id="rPlay">
      <div class="rank" id="rRank">A</div>
      <div id="rScore" style="font-size:22px;font-weight:700"></div>
      <div class="rgrid">
        <div><b class="good" id="rP">0</b><span>Perfect</span></div>
        <div><b style="color:var(--blue)" id="rG">0</b><span>Great</span></div>
        <div><b id="rGo">0</b><span>Good</span></div>
        <div><b class="bad" id="rM">0</b><span>Miss</span></div>
      </div>
      <div class="st" id="rInfo"></div>
      <div class="st" id="rOfs"></div>
    </div>
    <div id="rRec" hidden>
      <div style="font-size:22px;font-weight:700;margin:8px 0" id="rRecN"></div>
      <button class="btn" id="bRecPlay">この譜面で遊ぶ</button>
      <button class="btn sub" id="bRecCopy">譜面をコピー（Claudeに送る用）</button>
    </div>
    <button class="btn" id="bRetry">もう一回</button>
    <button class="btn sub" id="bFix" hidden>このズレを補正する</button>
    <button class="btn sub" id="bBack2">遊び方・設定を変える</button>
  </div>
</div>

<script>
// ---------- 設定 ----------
$('psg').innerHTML = LIST.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
const DEF = { flow: '3', bpm: '100', voice: 'af_heart' };
['psg', 'voice', 'bpm', 'flow'].forEach(k => { const v = S[k] ?? DEF[k]; if (v != null) $(k).value = v; });
$('ofs').value = S.ofs || 0; $('ofsv').textContent = $('ofs').value;
function setOfs(v) { $('ofs').value = v; $('ofsv').textContent = v; S.ofs = +v; saveS(); }
$('ofs').oninput = () => setOfs($('ofs').value);
const MODE_NAME = { con: '意味語', fill: '長押し＋タタタン', mix: 'ミックス', rec: '譜面作り', recplay: '自作の譜面' };
const HOW = {
  con: '<b>意味語</b>　英文の中の<b>大事な単語（名詞・動詞・形容詞など）</b>が声で読まれる瞬間に叩く。a・the・in などは叩かない。英語の強いところ＝リズムの山です。',
  fill: '<b>長押し＋タタタン</b>　オレンジの丸で叩いて、<b>声が終わるまで押しっぱなし</b>。チャンクのあいだの<b>青い丸はドラムに合わせてタタタン</b>。',
  mix: '<b>ミックス</b>　声の中では<b>大事な単語</b>を叩き、チャンクのあいだは<b>青い丸をタタタン</b>。',
  rec: '<b>譜面作り</b>　声とドラムが流れるので、<b>気持ちいいと思うところを自由に叩いて</b>ください。終わったらその譜面で遊べます。コピーしてClaudeに送ると配置のルール作りに使えます。'
};
let MODE = S.mode && HOW[S.mode] ? S.mode : 'con';
function setMode(m) { MODE = m; S.mode = m; saveS(); document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); $('how').innerHTML = HOW[m] + '<br>横画面がおすすめ。最初に「自動で測る」でズレを合わせておくと正確です。'; }
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.m));
setMode(MODE);
$('pst').textContent = '初回は声のエンジン（約330MB）と声づくりで数分かかります。2回目からはすぐ始まります。';
const st = (t, r) => { $('pst').textContent = t; if (r != null) $('pbar').style.width = (r * 100).toFixed(0) + '%'; };
const VOICE = {}; ['excellent', 'stage_clear'].forEach(k => { const a = new Audio(`../stream/audio/voice/${k}.mp3`); a.preload = 'auto'; VOICE[k] = a; });
function say(k) { try { const a = VOICE[k]; a.currentTime = 0; a.play(); } catch (e) {} }
const ROOT = [55, 43.65, 65.41, 49]; // Am F C G

// ---------- タイミング測定：ピッに合わせて8回叩く ----------
let CAL = null;
$('bCal').onclick = () => { $('setup').hidden = true; $('cal').hidden = false; $('calSt').textContent = ''; $('bCalGo').disabled = false; };
$('bCalBack').onclick = () => { CAL = null; $('cal').hidden = true; $('setup').hidden = false; };
$('bCalGo').onclick = () => {
  ac(); $('bCalGo').disabled = true; const iv = .6, t0 = AC.currentTime + .6, n = 12; // はじめの4つは聞くだけ
  for (let i = 0; i < n; i++) click(t0 + i * iv, i % 4 === 0);
  CAL = { t0, iv, n, taps: [] }; $('calSt').textContent = '4つ聞いたら、5つめから叩いてください';
  setTimeout(() => { if (!CAL) return; finishCal(); }, (n * iv + 1.2) * 1000);
};
$('calPad').addEventListener('pointerdown', e => {
  if (!CAL) return; e.preventDefault(); $('calPad').classList.add('hit'); setTimeout(() => $('calPad').classList.remove('hit'), 90);
  const at = AC.currentTime - Math.max(0, (performance.now() - e.timeStamp) / 1000) - (AC.outputLatency || AC.baseLatency || 0);
  const k = Math.round((at - CAL.t0) / CAL.iv); if (k >= 4 && k < CAL.n) CAL.taps.push(at - (CAL.t0 + k * CAL.iv));
  $('calSt').textContent = `${CAL.taps.length} / 8`;
});
function finishCal() {
  const d = CAL.taps.filter(x => Math.abs(x) < .3).sort((a, b) => a - b); CAL = null; $('bCalGo').disabled = false;
  if (d.length < 5) { $('calSt').textContent = 'うまく測れませんでした。もう一度どうぞ'; return; }
  const med = d[d.length >> 1], v = Math.max(-250, Math.min(250, Math.round(med * 100) * 10));
  setOfs(v); $('calSt').innerHTML = `<span class="good">測れました</span>：補正を ${v}ms にしました（ばらつき ${Math.round((d.at(-1) - d[0]) * 1000)}ms）`;
}

// ---------- 準備 ----------
let SONG = null;
$('bPrep').onclick = async () => {
  ac(); ['psg', 'voice', 'bpm', 'flow'].forEach(k => S[k] = $(k).value); saveS();
  const P = LIST[+$('psg').value], voice = $('voice').value;
  $('bPrep').disabled = true; $('pbar').style.width = '0%';
  try {
    const got = await getClips(P.chunks.map(c => c.en), voice, st);
    const am = autoShift(P.chunks.map(c => ({ text: c.en, v: got[c.en] })));
    SONG = { mode: MODE, chunks: P.chunks, got, voice, pid: P.id, noTs: P.chunks.filter(c => !got[c.en].wt).length };
    $('readyLead').textContent = MODE_NAME[MODE] + (SONG.noTs ? `（${SONG.noTs}チャンクは単語の時刻が取れなかったので、チャンクの頭だけ叩きます）` : '') + `。単語の時刻の補正：${Math.round(wshift() * 1000)}ms` + (am.used ? `（この端末で自動測定・${am.n}語）` : '（標準値）') + '。音を出せる状態にしてスタート。';
    $('setup').hidden = true; $('ready').hidden = false;
  } catch (e) { $('pst').innerHTML = `<span class="bad">失敗：</span>${e.message || e}`; }
  $('bPrep').disabled = false;
};
$('bBack1').onclick = $('bBack2').onclick = () => { $('ready').hidden = $('result').hidden = true; $('setup').hidden = false; };

// ---------- 曲（声・ノーツ・ドラムの並び）を作る：すべて拍とモデルの時刻から決める ----------
const PATS = [[0, .5, 1], [0, 1], [0, .5, 1, 1.5], [0, .5, 1]];   // タタタン、タン・タン、タタタタ…
function buildSong(bpm, mode) {
  const beat = 60 / bpm, notes = [], voices = [], lyr = [], fills = [], guides = [];
  const gapFill = mode === 'fill' || mode === 'mix';
  let b = 4; // 1小節カウントしてから
  SONG.chunks.forEach((c, ci) => {
    const v = SONG.got[c.en], buf = toBuf(v), t = b * beat, ws = words(c.en), d = buf.duration;
    voices.push({ buf, t }); lyr.push({ en: c.en, ja: c.ja, t, d, hit: false }); guides.push({ t, d, en: c.en });
    if (mode === 'fill') notes.push({ kind: 'chunk', t, d, en: c.en, ci });
    if (mode === 'con' || mode === 'mix') {
      if (v.wt) ws.forEach((w, j) => { if (isContent(w)) { const x = wtAt(v, j); notes.push({ kind: 'word', t: t + x.t, d: Math.max(.08, x.e - x.t), en: w, ci }); } });
      else notes.push({ kind: 'word', t, d, en: ws[0], ci });
    }
    let endB = b + Math.ceil((d + .05) / beat);
    if (gapFill) { const pat = PATS[ci % PATS.length]; pat.forEach((x, k) => { const ft = (endB + x) * beat, big = k === pat.length - 1; notes.push({ kind: 'fill', t: ft, d: .1, big, ci: -1 }); fills.push({ t: ft, big }); }); endB += 2; }
    else if (mode === 'rec' || mode === 'recplay') endB += 1;
    b = endB;
  });
  if (mode === 'recplay') SONG.rec.forEach(t => { let ci = -1, w = ''; lyr.forEach((L, i) => { if (t >= L.t - .1 && t <= L.t + L.d) ci = i; });
    if (ci >= 0) { const c = SONG.chunks[ci], v = SONG.got[c.en], ws = words(c.en); if (v.wt) v.wt.forEach((_, j) => { if (t >= lyr[ci].t + wtAt(v, j).t - .12) w = ws[j]; }); }
    notes.push({ kind: ci >= 0 ? 'word' : 'fill', t, d: .1, en: w, ci }); });
  notes.sort((x, y) => x.t - y.t);
  const total = Math.ceil((b + 1) / 4) * 4 + 4;
  return { notes, voices, lyr, fills, guides, beat, total };
}

// ---------- ゲーム ----------
const cv = $('cv'), cx = cv.getContext('2d');
let Wd = 0, Ht = 0, DPR = 1;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); Wd = innerWidth; Ht = innerHeight; cv.width = Wd * DPR; cv.height = Ht * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize); resize();

let G = null;
const JW = { p: .05, g: .1, ok: .15 };   // 判定の幅（秒）
function startGame(mode) {
  ac();
  const M = mode || SONG.mode, { notes, voices, lyr, fills, guides, beat, total } = buildSong(+$('bpm').value, M);
  const t0 = AC.currentTime + .7;
  for (let k = 0; k < total; k++) {
    const t = t0 + k * beat, q = k % 4, bar = Math.floor(k / 4);
    if (k < 4) { stick(t, q === 0); continue; }
    if (k >= total - 4) { if (k === total - 4) { kick(t); hat(t, .2); } continue; }
    if (q === 0 || q === 2) kick(t);
    if (q === 1 || q === 3) snare(t, .22);
    hat(t); hat(t + beat / 2, .05);
    if (q === 0 || q === 2) bass(t, ROOT[(bar - 1) % 4] * (q === 2 ? 1.5 : 1), beat * 1.9);
  }
  fills.forEach(f => { tom(t0 + f.t, !f.big); if (f.big) snare(t0 + f.t, .3); });   // タタタンの音
  const srcs = voices.map(v => { const s = AC.createBufferSource(); s.buffer = v.buf; s.connect(voiceG); s.start(t0 + v.t); return s; });
  G = { mode: M, notes, lyr, guides, beat, total, t0, srcs, score: 0, combo: 0, maxc: 0, cnt: { p: 0, g: 0, ok: 0, m: 0, hold: 0 }, dts: [], fx: [], judge: null, hold: null,
    end: t0 + total * beat, over: false, spMul: +$('flow').value, comboStep: M === 'fill' ? 5 : 10, rec: [] };
  $('ready').hidden = true; $('result').hidden = true; $('quit').hidden = false;
  try { document.documentElement.requestFullscreen?.().then(() => screen.orientation?.lock?.('landscape')).catch(() => {}); } catch (e) {}
}
function lat() { return (AC.outputLatency || AC.baseLatency || 0) + (+$('ofs').value) / 1000; }
function songNow(at) { return (at ?? AC.currentTime) - G.t0 - lat(); }

function popJudge(txt, col) { G.judge = { txt, col, t: performance.now() }; }
function addScore(base) { G.combo++; G.maxc = Math.max(G.maxc, G.combo); G.score += base + Math.min(G.combo, 50) * 10; if (G.combo % G.comboStep === 0) chara(G.combo); }
let charaT = 0, charaSide = 0;
function chara(c) {
  charaSide ^= 1; $('charaImg').src = `../stream/img/chara/${charaSide ? 'girl' : 'boy'}/joy.webp`; $('bub').textContent = `${c} Combo!`;
  $('chara').classList.add('on'); clearTimeout(charaT); charaT = setTimeout(() => $('chara').classList.remove('on'), 1100);
}
function burst(col) { for (let i = 0; i < 12; i++) { const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 220; G.fx.push({ x: 0, y: 0, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .4, col }); } }

cv.addEventListener('pointerdown', e => {
  if (!G || G.over) return;
  e.preventDefault(); don();
  const at = AC.currentTime - Math.max(0, (performance.now() - e.timeStamp) / 1000), tt = songNow(at);
  if (G.mode === 'rec') { G.rec.push(+tt.toFixed(3)); burst('#ffb23e'); popJudge('●', '#ffb23e'); return; }
  let best = null, bd = 9;
  for (const n of G.notes) { if (n.st) continue; const d = tt - n.t; if (Math.abs(d) < bd) { bd = Math.abs(d); best = n; } if (n.t > tt + 1) break; }
  if (!best || bd > JW.ok + .03) return;               // 何もないところを叩いても減点なし
  const dt = tt - best.t; best.st = 1; G.dts.push(dt); if (best.ci >= 0) G.lyr[best.ci].hit = true;
  if (bd <= JW.p) { G.cnt.p++; popJudge('Perfect', '#ffd166'); addScore(1000); burst('#ffd166'); }
  else if (bd <= JW.g) { G.cnt.g++; popJudge(dt < 0 ? 'Great（早い）' : 'Great（遅い）', '#5ab0ff'); addScore(700); burst('#5ab0ff'); }
  else { G.cnt.ok++; popJudge(dt < 0 ? 'Good（早い）' : 'Good（遅い）', '#c9d6e8'); addScore(300); burst('#c9d6e8'); }
  if (best.kind === 'chunk') G.hold = { n: best, id: e.pointerId };
});
function release(e) { if (!G || !G.hold || G.hold.id !== e.pointerId) return; const n = G.hold.n; G.hold = null;
  if (n.st === 1) { const tt = songNow(); if (tt >= n.t + n.d * .8) holdOK(n); else n.st = 2; } }
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
function holdOK(n) { n.st = 2; G.cnt.hold++; G.score += 300; popJudge('ホールド◎', '#5fd38d'); }
$('quit').onclick = () => { if (!G) return; G.srcs.forEach(s => { try { s.stop(); } catch (e) {} }); G.over = true; master.gain.setValueAtTime(0, AC.currentTime); setTimeout(() => master.gain.setValueAtTime(1, AC.currentTime), 300); $('quit').hidden = true; $('setup').hidden = false; G = null; };

// ---------- 描画 ----------
const EN = '"Helvetica Neue",Arial,sans-serif', JA = '"Hiragino Sans","Noto Sans JP",sans-serif';
function rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect ? cx.roundRect(x, y, w, h, r) : cx.rect(x, y, w, h); }
function fitFont(txt, maxW, big, small, weight = 600) { let f = big; cx.font = `${weight} ${f}px ${EN}`; while (f > small && cx.measureText(txt).width > maxW) { f -= 1; cx.font = `${weight} ${f}px ${EN}`; } return f; }
function sweep(txt, x, y, f, pr, col) { const w = cx.measureText(txt).width; cx.save(); cx.beginPath(); cx.rect(x, y - f, w * pr, f * 2); cx.clip(); cx.fillStyle = col; cx.fillText(txt, x, y); cx.restore(); }
let lastF = performance.now();
function frame() {
  requestAnimationFrame(frame);
  const nowP = performance.now(), dt = Math.min(.05, (nowP - lastF) / 1000); lastF = nowP;
  const grd = cx.createLinearGradient(0, 0, 0, Ht); grd.addColorStop(0, '#132544'); grd.addColorStop(1, '#0b1424'); cx.fillStyle = grd; cx.fillRect(0, 0, Wd, Ht);
  if (!G) return;
  const now = songNow(), beat = G.beat;
  const laneY = Math.round(Ht * .40), laneH = Math.min(96, Ht * .24), JX = Math.min(90, Wd * .13);
  const SP = Math.max(200, Wd * .34) * G.spMul;
  cx.fillStyle = 'rgba(8,14,26,.75)'; cx.fillRect(0, laneY - laneH / 2, Wd, laneH);
  cx.fillStyle = 'rgba(255,255,255,.06)'; cx.fillRect(0, laneY - laneH / 2, Wd, 2); cx.fillRect(0, laneY + laneH / 2 - 2, Wd, 2);
  const bFirst = Math.floor((now - JX / SP) / beat), bLast = Math.ceil((now + (Wd - JX) / SP) / beat);
  for (let k = Math.max(0, bFirst); k <= Math.min(G.total, bLast); k++) { const x = JX + (k * beat - now) * SP; cx.fillStyle = k % 4 === 0 ? 'rgba(255,255,255,.16)' : 'rgba(255,255,255,.06)'; cx.fillRect(x - 1, laneY - laneH / 2, 2, laneH); }
  // 声の帯（意味語・譜面作りモードで、どこが読まれているかの目安）
  if (G.mode !== 'fill') G.guides.forEach(g => { const x0 = JX + (g.t - now) * SP, x1 = x0 + g.d * SP; if (x1 < 0 || x0 > Wd) return; rr(x0, laneY - laneH * .36, x1 - x0, laneH * .72, 12); cx.fillStyle = 'rgba(255,178,62,.07)'; cx.fill(); });
  const ph = now >= 0 ? (now / beat) % 1 : 0, pulse = 1 + (1 - Math.min(1, ph * 4)) * .12 * (now > -beat * 4 ? 1 : 0);
  cx.lineWidth = 4; cx.strokeStyle = 'rgba(255,255,255,.75)'; cx.beginPath(); cx.arc(JX, laneY, 29 * pulse, 0, Math.PI * 2); cx.stroke();
  cx.lineWidth = 2; cx.strokeStyle = 'rgba(255,255,255,.25)'; cx.beginPath(); cx.arc(JX, laneY, 38 * pulse, 0, Math.PI * 2); cx.stroke();
  cx.textBaseline = 'middle';
  for (let i = G.notes.length - 1; i >= 0; i--) {
    const n = G.notes[i], x0 = JX + (n.t - now) * SP, x1 = x0 + n.d * SP;
    if (!n.st && now > n.t + JW.ok) { n.st = 3; G.cnt.m++; G.combo = 0; popJudge('Miss', '#ff6b6b'); }
    if (n.st === 1 && now > n.t + n.d) { if (G.hold && G.hold.n === n) { G.hold = null; holdOK(n); } else n.st = 2; }
    if (x1 < -60 || x0 > Wd + 60) continue;
    if (n.kind === 'chunk') drawChunk(n, x0, x1, now, laneY, laneH, JX);
    else if (n.kind === 'fill') drawFill(n, x0, now, laneY, laneH, JX);
    else drawWord(n, x0, now, laneY, laneH, JX);
  }
  if (G.mode === 'rec') G.rec.forEach(t => { const x = JX + (t - now) * SP; if (x < -20 || x > Wd) return; cx.fillStyle = '#ffb23e'; cx.beginPath(); cx.arc(x, laneY + laneH * .14, 9, 0, Math.PI * 2); cx.fill(); });
  G.fx = G.fx.filter(p => (p.life -= dt) > 0);
  G.fx.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; cx.globalAlpha = Math.min(1, p.life * 2.5); cx.fillStyle = p.col; cx.beginPath(); cx.arc(JX + p.x, laneY + p.y, 4, 0, Math.PI * 2); cx.fill(); });
  cx.globalAlpha = 1;
  if (G.judge) { const a = (performance.now() - G.judge.t) / 1000; if (a < .45) { cx.globalAlpha = 1 - a / .45; cx.font = `900 ${Math.round(24 + (1 - Math.min(1, a * 6)) * 10)}px ${EN}`; cx.textBaseline = 'bottom'; cx.textAlign = 'center'; cx.fillStyle = G.judge.col; cx.fillText(G.judge.txt, JX + 40, laneY - laneH / 2 - 26 - a * 20); cx.textAlign = 'left'; cx.globalAlpha = 1; } }
  cx.textBaseline = 'top'; cx.font = `700 18px ${EN}`; cx.fillStyle = '#eef2f7'; cx.fillText(G.mode === 'rec' ? `記録中 ${G.rec.length}` : String(G.score).padStart(6, '0'), 14, 12);
  if (G.combo >= 2) { cx.font = `900 30px ${EN}`; cx.fillStyle = '#ffb23e'; cx.textAlign = 'center'; cx.fillText(G.combo, JX, laneY + laneH / 2 + 8); cx.font = '700 11px sans-serif'; cx.fillText('COMBO', JX, laneY + laneH / 2 + 40); cx.textAlign = 'left'; }
  if (now < 0) { const c = Math.ceil(-now / beat); if (c <= 4) { cx.font = `900 64px ${EN}`; cx.fillStyle = 'rgba(255,255,255,.85)'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(c === 1 ? 'Go!' : c - 1, Wd / 2, laneY); cx.textAlign = 'left'; } }
  let cur = null; for (const L of G.lyr) { if (now >= L.t - beat && now <= L.t + L.d + beat * .5) { cur = L; break; } }
  if (cur) {
    const ly = laneY + laneH / 2 + Math.max(60, (Ht - laneY - laneH / 2) * .42), lx = Math.max(JX + 60, Wd * .2), lw = Wd - lx - 24;
    const f = fitFont(cur.en, lw, Math.round(Math.min(30, Ht * .07)), 14, 700);
    cx.textBaseline = 'middle'; cx.fillStyle = 'rgba(255,255,255,.5)'; cx.fillText(cur.en, lx, ly);
    sweep(cur.en, lx, ly, f, Math.max(0, Math.min(1, (now - cur.t) / cur.d)), '#ffffff');
    if (cur.hit || G.mode === 'rec') { cx.font = `600 ${Math.round(Math.min(17, Ht * .042))}px ${JA}`; cx.fillStyle = 'rgba(95,211,141,.9)'; cx.fillText(cur.ja, lx, ly + f * .5 + 14); }
  }
  if (!G.over && AC.currentTime > G.end) { G.over = true; showResult(); }
}
function drawChunk(n, x0, x1, now, laneY, laneH, JX) {
  const active = n.st === 1 && G.hold && G.hold.n === n, th = laneH * .62, from = n.st ? Math.max(x0, JX) : x0;
  rr(from, laneY - th / 2, Math.max(0, x1 - from), th, th / 2);
  cx.fillStyle = n.st === 3 ? 'rgba(255,107,107,.12)' : active ? 'rgba(255,178,62,.45)' : 'rgba(255,178,62,.18)'; cx.fill();
  cx.lineWidth = 2; cx.strokeStyle = n.st === 3 ? 'rgba(255,107,107,.4)' : 'rgba(255,178,62,.6)'; cx.stroke();
  const hit = n.st === 1 || n.st === 2, tx = hit ? Math.max(x0 + 34, JX + 40) : x0 + 34, tw = Math.max(80, x1 - x0 - 40);
  if (n.st === 2 && now > n.t + n.d) cx.globalAlpha = Math.max(0, 1 - (now - n.t - n.d) * 3);
  const f = fitFont(n.en, tw, Math.round(Math.min(24, laneH * .26)), 12);
  cx.fillStyle = n.st === 3 ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.92)'; cx.fillText(n.en, tx, laneY);
  if (hit) sweep(n.en, tx, laneY, f, Math.max(0, Math.min(1, (now - n.t) / n.d)), '#ffb23e');
  cx.globalAlpha = 1;
  if (!n.st) { cx.beginPath(); cx.arc(x0, laneY, 26, 0, Math.PI * 2); cx.fillStyle = '#ff8a1e'; cx.fill(); cx.lineWidth = 3; cx.strokeStyle = '#fff'; cx.stroke(); cx.beginPath(); cx.arc(x0 - 7, laneY - 8, 6, 0, Math.PI * 2); cx.fillStyle = 'rgba(255,255,255,.55)'; cx.fill(); }
}
function drawWord(n, x0, now, laneY, laneH, JX) {
  const r = Math.min(20, laneH * .2), hy = laneY + laneH * .14;
  if (n.st === 1 || n.st === 2) { const a = Math.max(0, 1 - (now - n.t) * 2.5); if (a <= 0 || !n.en) return;
    cx.globalAlpha = a; cx.font = `700 ${Math.round(Math.min(20, laneH * .22))}px ${EN}`; cx.textAlign = 'center'; cx.fillStyle = '#ffb23e'; cx.fillText(n.en, JX, laneY - laneH * .26 - (1 - a) * 10); cx.textAlign = 'left'; cx.globalAlpha = 1; return; }
  cx.globalAlpha = n.st === 3 ? .35 : 1;
  cx.beginPath(); cx.arc(x0, hy, r, 0, Math.PI * 2); cx.fillStyle = n.st === 3 ? '#7a3b3b' : '#ff8a1e'; cx.fill(); cx.lineWidth = 2.5; cx.strokeStyle = '#fff'; cx.stroke();
  if (n.en) { cx.font = `600 ${Math.round(Math.min(18, laneH * .2))}px ${EN}`; cx.textAlign = 'center'; cx.fillStyle = '#fff'; cx.fillText(n.en, x0, laneY - laneH * .26); cx.textAlign = 'left'; }
  cx.globalAlpha = 1;
}
function drawFill(n, x0, now, laneY, laneH, JX) {
  const r = n.big ? 19 : 14, hy = laneY + laneH * .14;
  if (n.st === 1 || n.st === 2) return;
  cx.globalAlpha = n.st === 3 ? .35 : 1;
  cx.beginPath(); cx.arc(x0, hy, r, 0, Math.PI * 2); cx.fillStyle = n.st === 3 ? '#3b4a7a' : '#3d8bff'; cx.fill(); cx.lineWidth = 2.5; cx.strokeStyle = '#fff'; cx.stroke();
  cx.globalAlpha = 1;
}
requestAnimationFrame(frame);

// ---------- 結果 ----------
function showResult() {
  $('quit').hidden = true; $('rMode').textContent = MODE_NAME[G.mode] + '　結果';
  const isRec = G.mode === 'rec'; $('rPlay').hidden = isRec; $('rRec').hidden = !isRec; $('bRetry').textContent = isRec ? '記録しなおす' : 'もう一回';
  if (isRec) { SONG.rec = G.rec.slice(); $('rRecN').textContent = `${G.rec.length} 回叩きました`; $('bFix').hidden = true; $('result').hidden = false; return; }
  const c = G.cnt, N = G.notes.length, acc = (c.p + c.g * .7 + c.ok * .4) / N;
  const rank = acc >= .95 ? 'S' : acc >= .85 ? 'A' : acc >= .7 ? 'B' : 'C';
  $('rRank').textContent = rank; $('rScore').textContent = G.score.toLocaleString() + ' 点';
  $('rP').textContent = c.p; $('rG').textContent = c.g; $('rGo').textContent = c.ok; $('rM').textContent = c.m;
  $('rInfo').textContent = `最大コンボ ${G.maxc} / ${N}` + (G.mode === 'fill' ? ` ／ ホールド成功 ${c.hold}` : '');
  if (G.dts.length >= 3) { const avg = G.dts.reduce((a, x) => a + x, 0) / G.dts.length, ms = Math.round(avg * 1000);
    $('rOfs').textContent = `平均のズレ：${ms > 0 ? '+' : ''}${ms}ms（${Math.abs(ms) < 25 ? 'ちょうどいい' : ms > 0 ? '遅め' : '早め'}）`;
    $('bFix').hidden = Math.abs(ms) < 25; $('bFix').onclick = () => { const v = Math.max(-250, Math.min(250, Math.round(((+$('ofs').value) + ms) / 10) * 10)); setOfs(v); $('bFix').hidden = true; $('rOfs').textContent += ` → 補正を ${v}ms にしました`; };
  } else { $('rOfs').textContent = ''; $('bFix').hidden = true; }
  $('result').hidden = false; say(rank === 'S' || rank === 'A' ? 'excellent' : 'stage_clear');
}
$('bStart').onclick = () => startGame();
$('bRetry').onclick = () => startGame(G && G.mode === 'recplay' ? 'recplay' : undefined);
$('bRecPlay').onclick = () => startGame('recplay');
$('bRecCopy').onclick = async () => {
  const L = buildSong(+$('bpm').value, 'rec').lyr;
  const txt = JSON.stringify({ passage: SONG.pid, bpm: +$('bpm').value, voice: SONG.voice,
    chunks: L.map((x, i) => ({ en: x.en, t: +x.t.toFixed(3), words: (SONG.got[x.en].wt || []).map((_, j) => [words(x.en)[j], +(x.t + wtAt(SONG.got[x.en], j).t).toFixed(3)]) })), shift: wshift(), taps: SONG.rec });
  try { await navigator.clipboard.writeText(txt); $('bRecCopy').textContent = 'コピーしました'; } catch (e) { $('bRecCopy').textContent = 'コピーできませんでした'; }
};
</script>
</body>
