 --tw-pink:#ffb3c1;--tw-mint:#a8e6cf;--tw-lav:#c9b8ea;--tw-cream:#fffaf2;--tw-ink:#5a4a6b;--tw-sub:#8d7f9e;--tw-shadow:0 6px 18px rgba(90,74,107,.18);--tw-top:env(safe-area-inset-top,0px);--tw-bot:env(safe-area-inset-bottom,0px)}
