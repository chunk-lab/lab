<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe9ef"><title>ほしみや町</title>
<style>html,body{margin:0;height:100%;background:#ffe9ef;overscroll-behavior:none}#town{position:fixed;inset:0}</style>
</head><body><div id="town"></div>
<script>/*APP*/</script>
<script>
var q = new URLSearchParams(location.search);
// テスト用: ?coins=10000 でコインを増やして始められる(この端末の保存だけが変わる)
if (/^\d{1,6}$/.test(q.get('coins') || '')) { try { localStorage.setItem('town:coins', JSON.stringify(+q.get('coins'))); } catch (e) {} }
window.town = Hoshimiya.mount(document.getElementById('town'), { netUrl: q.get('server') || undefined, room: q.get('room') || 'town' });
</script></body></html>
