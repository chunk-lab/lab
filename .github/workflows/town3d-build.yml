# town3d のビルドだけを行う(公開はしない)。できた index.html は、Actions の実行結果からダウンロードできる
name: town3d build
on:
  push:
    branches-ignore: [main]
    paths: ['town3d/**', '.github/workflows/town3d-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: town3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-audit --no-fund
      - run: node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: town3d-index-html
          path: town3d/dist/index.html
