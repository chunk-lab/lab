<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>チャンク・カード</title>
<style>
:root{--bg1:#3d2f63;--bg2:#1e1633;--ink:#3a2c4a;--y:#ffcf5a;--pk:#ff5f8f;--pu:#6a4cf0;--bl:#3c8cff;--rd:#ff4f6d;--gr:#3cc98a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg2);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","M PLUS Rounded 1c",sans-serif;color:#fff;overscroll-behavior:none}
#app{position:relative;max-width:480px;height:100%;height:100dvh;margin:0 auto;background:radial-gradient(120% 80% at 50% 0%,#4b3a7a,var(--bg1) 40%,var(--bg2));overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 24px);animation:fade .25s;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scr>*{flex-shrink:0}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
button{font-family:inherit}
.btn{border:0;border-radius:16px;padding:14px;font-weight:900;font-size:17px;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.35;filter:grayscale(.6)}
.go{background:linear-gradient(180deg,#ff7aa3,var(--pk))}.ghost{background:rgba(255,255,255,.14)}.play{background:linear-gradient(180deg,#56dba0,var(--gr))}.disc{background:linear-gradient(180deg,#ff6b7f,#e33c57)}
.small{padding:8px 12px;font-size:13px}
/* タイトル */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.logo{display:flex;flex-direction:column;align-items:center;font-weight:900;line-height:.95;letter-spacing:2px;text-shadow:0 5px 0 rgba(0,0,0,.3)}
.logo span:first-child{font-size:56px;color:var(--y)}.logo span:last-child{font-size:56px;color:#fff}
.sub{opacity:.85;font-weight:800}
.fan{display:flex;margin:18px 0 26px}.fan .card{transform:rotate(var(--r));margin:0 -6px}
.title .btn{width:240px}
.rec{font-size:12.5px;opacity:.8;text-align:center;line-height:1.6}
/* カード */
.card{position:relative;width:50px;height:70px;border-radius:9px;background:#fffdf6;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:13.5px;line-height:1.05;box-shadow:0 3px 0 rgba(0,0,0,.28);border-top:7px solid var(--c);flex:0 0 auto;cursor:pointer;transition:transform .12s,box-shadow .12s;touch-action:none;padding:0 2px;word-break:break-word}
.card.big{width:70px;height:96px;font-size:17px;border-top-width:10px}
.card i{position:absolute;bottom:2px;right:4px;font-style:normal;font-size:9px;color:#a08ac0}
.card u{position:absolute;bottom:2px;left:4px;text-decoration:none;font-size:8.5px;color:#3cc98a;font-weight:900}
.card em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9px;white-space:nowrap;background:rgba(0,0,0,.45);color:#fff;border-radius:6px;padding:1px 4px}
.card .rm{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:#4a3a6a;color:#fff;font-size:12px;line-height:18px;font-style:normal}
.card.n{--c:#5aa7ff}.card.v{--c:#ff6f7f}.card.m{--c:#4cd08a}.card.p{--c:#ffcc40}.card.a{--c:#ff9a45}.card.c{--c:#b07cff}
.card.tsu{width:auto;min-width:42px;height:42px;border-radius:12px;border-top-width:5px;padding:0 8px;font-size:12px}
.card.tsu i{display:none}
.card.rare{background:linear-gradient(160deg,#fffdf6 60%,#fff1c2)}
.card.drag{z-index:10;box-shadow:0 10px 20px rgba(0,0,0,.4)}
.card.ins{box-shadow:-4px 0 0 var(--y),0 3px 0 rgba(0,0,0,.28)}
.card.hit{animation:hit .35s}
@keyframes hit{50%{transform:translateY(-10px) scale(1.12)}}
/* 上部 */
.top{display:flex;align-items:center;gap:8px}
.stg{background:var(--pu);border-radius:12px;padding:6px 9px;font-weight:900;font-size:13px;white-space:nowrap}.stg small{opacity:.7}.stg.boss{background:#c83250}
.goal{flex:1;display:flex;align-items:center;gap:6px;font-size:11px}.goal b{font-size:15px;color:var(--y)}
.bar{flex:1;height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--pk));width:0;transition:width .1s}
.res{display:flex;gap:4px;font-size:9.5px;font-weight:800}.res span{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.12);border-radius:9px;padding:3px 6px}.res b{font-size:14px}.res .money b{color:var(--y)}
.jokers{display:flex;gap:5px;margin-top:8px}
.joker{flex:1;min-height:62px;border-radius:10px;background:linear-gradient(160deg,#ffe08a,#ffb21f);color:var(--ink);padding:5px;font-size:8.5px;font-weight:800;line-height:1.3;border:2px solid rgba(255,255,255,.5)}
.joker b{display:block;font-size:10.5px;margin-bottom:2px}
.joker.empty{background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.18);color:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
.bossbar{margin-top:6px;background:rgba(239,77,99,.22);border:1.5px dashed #ff8fa6;border-radius:10px;padding:5px 9px;font-size:11.5px;font-weight:800}
.board{margin-top:8px;background:rgba(0,0,0,.18);border-radius:16px;padding:18px 8px 8px;min-height:230px;flex:0 0 auto;display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;gap:16px 5px;min-height:70px;align-content:flex-start;padding-top:2px}
.row .ph{opacity:.45;font-size:12px;font-weight:800;margin:auto}
.pv{margin-top:auto;text-align:center}
.sent{font-weight:900;font-size:15.5px;min-height:22px;margin:8px 0 2px}.sent.ok{color:#fff}.sent.bad,.sent.wait{color:rgba(255,255,255,.55)}
.yk{color:var(--y);font-weight:900;font-size:12.5px;min-height:17px}
.cm{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:5px}
.chips,.mult{min-width:76px;border-radius:12px;padding:5px 10px;font-size:22px;font-weight:900}.chips{background:var(--bl)}.mult{background:var(--rd)}.x{font-weight:900;font-size:20px}
.msg{min-height:16px;margin-top:5px;font-size:12px;font-weight:800;color:#ffb3c0}
.bump{animation:bump .25s}@keyframes bump{50%{transform:scale(1.2)}}
.field{margin-top:8px;background:rgba(255,255,255,.06);border-radius:12px;padding:6px 8px}
.flbl{display:flex;justify-content:space-between;font-size:11px;font-weight:800;opacity:.85}.flbl .pts b{color:var(--y);font-size:14px}
.frow{display:flex;gap:4px;margin-top:5px;min-height:44px;align-items:center;overflow-x:auto}.frow .ph{opacity:.4;font-size:11px;font-weight:800}
.card.mini{width:38px;height:52px;font-size:10.5px;border-top-width:5px}.card.mini i{font-size:8px}
.card.can{outline:3px solid var(--y);animation:glow 1s infinite alternate}.card.cant{opacity:.4}
@keyframes glow{to{outline-color:#fff6c8}}
.fhint{font-size:11.5px;font-weight:800;color:var(--y);min-height:0}.fhint:empty{display:none}
.card.marked{transform:translateY(8px);opacity:.75}.card.marked::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:#ef4d63;font-weight:900;text-shadow:0 2px 0 #fff}
.tsu{margin-top:8px}
.tabs{display:flex;gap:4px;overflow-x:auto}.tab{flex:1;border:0;border-radius:10px 10px 0 0;padding:6px 2px;font-size:11px;font-weight:900;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);white-space:nowrap}.tab.on{background:rgba(255,255,255,.2);color:#fff}
.tw{display:flex;flex-wrap:wrap;gap:6px;background:rgba(255,255,255,.12);border-radius:0 0 12px 12px;padding:8px;min-height:54px}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.hand .card{width:54px;height:78px;font-size:14px}
.btns{display:flex;gap:10px;margin-top:auto;padding-top:10px}.btns .btn{flex:1}.btns .play{flex:1.6}
.float{position:absolute;transform:translate(-50%,-10px);font-weight:900;font-size:16px;pointer-events:none;animation:up .9s forwards;text-shadow:0 2px 0 rgba(0,0,0,.4);z-index:30}
.float.c{color:#8ec5ff}.float.m{color:#ff8fa0}.float.x{color:var(--y);font-size:20px}
@keyframes up{to{transform:translate(-50%,-50px);opacity:0}}
.bigscore{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:52px;font-weight:900;color:var(--y);text-shadow:0 5px 0 rgba(0,0,0,.35);z-index:40;animation:pop .3s}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4)}}
/* クリア・お店・終了 */
.clear,.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.clear h1,.end h1{font-size:30px;margin:0;color:var(--y)}
.pay{background:rgba(255,255,255,.1);border-radius:14px;padding:12px 16px;width:260px}.pay div{display:flex;justify-content:space-between;padding:4px 0;font-weight:800}.pay b{color:var(--y)}
.money.big{font-size:30px;font-weight:900;color:var(--y)}
.clear .btn,.end .btn{width:240px}
.shop{flex:1;display:flex;flex-direction:column}
.shead{display:flex;justify-content:space-between;align-items:center}.shead h1{margin:4px 0;font-size:26px}.shead .money{font-size:22px;font-weight:900;color:var(--y)}
.next{font-size:12px;opacity:.8;font-weight:800}
.items{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:14px;padding:8px;cursor:pointer}
.item .joker{flex:0 0 86px;min-height:70px}
.item.poor{opacity:.5}.item.sold{justify-content:center;opacity:.4;min-height:50px;font-weight:800}
.pack{flex:0 0 86px;height:70px;border-radius:12px;background:linear-gradient(160deg,#9a80ff,var(--pu));display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:13px;text-align:center}
.pack.book{background:linear-gradient(160deg,#ff9ec0,#e8457e)}.pack.boost{background:linear-gradient(160deg,#6fe0ad,#2fbf83)}
.desc{flex:1;font-size:12px;font-weight:700;line-height:1.5}
.price{background:var(--y);color:var(--ink);border-radius:10px;padding:6px 8px;font-weight:900;white-space:nowrap}
.myj{margin-top:12px}.lbl{font-size:11px;opacity:.75;font-weight:800;margin-bottom:5px}
.sbtns{display:flex;gap:10px;margin-top:auto}.sbtns .btn{flex:1}
.modal{position:absolute;inset:0;background:rgba(10,5,25,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:#3b2d5f;border-radius:20px;padding:16px;width:100%;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;color:var(--y);font-size:20px}.box ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.6;font-weight:700}
.pick{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.pick.scroll{max-height:50vh;overflow:auto;gap:6px}
.pc{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}.pc .ja{font-size:12px;text-align:center;font-weight:800}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:10px 14px;border-radius:12px;font-weight:800;font-size:13px;z-index:60}
.st,.tot{font-weight:800;opacity:.9}.bestS{background:rgba(255,255,255,.1);border-radius:14px;padding:12px;width:100%}.bestS .t{font-size:17px;font-weight:900;margin:6px 0}

/* 追加要素 */
.card.guest{background:linear-gradient(160deg,#fff7d6,#ffe08a);box-shadow:0 0 0 2px #ffb21f,0 3px 0 rgba(0,0,0,.28)}
.card.wild{background:linear-gradient(160deg,#efe6ff,#d4c2ff);box-shadow:0 0 0 2px #9a80ff,0 3px 0 rgba(0,0,0,.28)}
.mbar{margin-top:6px;font-size:10.5px;font-weight:800;line-height:1.9}.mc{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:8px;background:rgba(90,167,255,.18)}.mc b{color:var(--y)}.mc.t0{border:1.5px solid #3cc98a}.mc.t1{border:1.5px solid #ffb21f}.mc.t2{border:1.5px solid #ef4d63}.mc.hit{background:rgba(95,224,165,.3)}
.qbar{margin-top:2px;font-size:10.5px;font-weight:800;line-height:1.9}.qc{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:8px;background:rgba(255,255,255,.12)}.qc.t0{border:1.5px solid #3cc98a}.qc.t1{border:1.5px solid #ffb21f}.qc.t2{border:1.5px solid #ef4d63}.qc.hit{background:rgba(95,224,165,.3)}
.qrev{font-size:24px;font-weight:900;text-align:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.1)}
.msg .gd{color:#7df0b8}.pack.itp{background:linear-gradient(160deg,#c9b5ff,#7b5cf0)}
.combos{display:flex;flex-wrap:wrap;gap:6px;max-height:50vh;overflow:auto}.combos span{background:rgba(255,255,255,.12);border-radius:8px;padding:4px 8px;font-size:12.5px;font-weight:800}
.box .res{text-align:center;font-weight:900;font-size:18px}.box .res.w{color:#5fe0a5}.box .res.l{color:#ff8fa6}
/* 対戦 */
.ribar{margin-top:4px;color:#ffcf5a;font-weight:900;font-size:11.5px}.card.mini.byguest{box-shadow:0 0 0 2px #ffb21f}
.btn.ri{flex:.9;line-height:1.1;font-size:13px}.btn.ri small{font-size:9.5px;opacity:.85}
.sd .bon{margin-top:4px;font-size:12px;font-weight:900;color:#ffcf5a}.qrev2{text-align:center;font-weight:800;font-size:13px}.qrev2 b{color:#ffcf5a}
.card s.of{position:absolute;bottom:3px;left:4px;text-decoration:none;font-size:9px;color:#5aa7ff;font-weight:900}
.vrules{font-size:12px;font-weight:700;line-height:1.6}.vrules summary{font-weight:900;color:var(--y);cursor:pointer}.vrules ol{padding-left:18px;margin:6px 0}
.btn.vs{background:linear-gradient(180deg,#8f78ff,#5b3fe0)}
.opps{display:flex;flex-direction:column;gap:8px}.oppc{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.1);border-radius:14px;padding:10px;cursor:pointer}.oppc .face{font-size:38px}.oppc p{margin:3px 0;font-size:12px;line-height:1.5;font-weight:700}.oppc small{opacity:.7}
.lvtag{font-size:10px;border-radius:8px;padding:2px 6px;background:#3cc98a}.lvtag.l1{background:#ffb21f;color:#3a2c4a}.lvtag.l2{background:#ef4d63}
.vtop{display:flex;align-items:center;gap:6px}.vh{background:var(--pu);border-radius:12px;padding:6px 9px;font-weight:900;font-size:12px;white-space:nowrap}
.pot{flex:1;text-align:center;font-weight:900;font-size:20px;color:var(--y)}.pot small{font-size:10px;color:#fff;opacity:.7;margin-left:4px}
.vmed{display:flex;gap:4px;font-size:10px;font-weight:800}.vmed span{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.12);border-radius:9px;padding:3px 7px}.vmed b{font-size:14px;color:var(--y)}
.vq{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:9px;width:28px;height:28px;font-weight:900}
.opp{display:flex;align-items:center;gap:8px;margin-top:8px;background:rgba(239,77,99,.12);border-radius:14px;padding:6px 8px;position:relative;min-height:56px}
.opp .face{font-size:32px}.oinfo{flex:1;min-width:0}.oname{font-weight:900;font-size:13px}.oname small{margin-left:8px;font-size:10.5px;opacity:.8}.oname b{color:var(--y)}
.backs{display:flex;gap:2px;margin-top:4px}.cback{width:16px;height:22px;border-radius:4px;background:repeating-linear-gradient(45deg,#ef4d63,#ef4d63 3px,#c83250 3px,#c83250 6px);border:1.5px solid #fff8}
.bubble{position:absolute;right:8px;top:6px;max-width:52%;background:#fff;color:var(--ink);font-weight:900;font-size:11.5px;border-radius:12px;padding:5px 9px;opacity:0;line-height:1.35}.bubble.on{opacity:1}.bubble.hot{background:#ffcf5a}.bubble.think{opacity:.7}
.rule{margin-top:6px;font-size:11px;font-weight:800;background:rgba(255,207,90,.14);border:1.5px dashed rgba(255,207,90,.6);border-radius:10px;padding:4px 8px}.rule:empty{display:none}.rule b{color:var(--y)}
.vturn{margin-top:6px;font-size:12px;font-weight:800;text-align:center}.vturn .you{color:var(--y)}
.cm .eq{margin-left:8px;font-weight:900;font-size:18px;color:var(--y)}
.card.mini.bycpu{box-shadow:0 0 0 2px #ef4d63}.card.mini.byme{box-shadow:0 0 0 2px #5aa7ff}
.flbl i{font-style:normal}.flbl i.me{color:#8cc4ff}.flbl i.cp{color:#ff8fa6}
.sd .side{background:rgba(255,255,255,.08);border-radius:14px;padding:8px 10px}.sd .side.cp{background:rgba(239,77,99,.14)}
.sd .who{font-size:12px;font-weight:900;opacity:.8}.sd .tx{font-weight:900;font-size:15px;margin:4px 0}.sd .yk2{color:var(--y);font-size:12px;font-weight:900}
.sd .cm2{font-weight:900;font-size:15px;margin-top:4px}.sd .cm2 .chips{background:#3c8cff;border-radius:8px;padding:2px 7px;margin-right:3px}.sd .cm2 .mult{background:#ff4f6d;border-radius:8px;padding:2px 7px;margin:0 3px}.sd .cm2 .tot{font-size:20px;color:var(--y)}
.srow .card.tsu{height:52px;min-width:28px;padding:0 4px;font-size:10px}.srow{display:flex;align-items:flex-end;flex-wrap:wrap;gap:3px;margin-top:4px}
.sd .res{text-align:center;font-weight:900;font-size:20px;margin:4px 0;min-height:26px}.sd .res.w{color:#5fe0a5}.sd .res.l{color:#ff8fa6}
</style></head>
<body><div id="app"></div>
<script>/*@@CORE@@*/</script>
<script>/*@@CARDS@@*/</script>
</body></html>
