<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>チャンクチャンク リーディング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Lexend:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0f1b2d; --bg2:#0b1524; --surface:#172a45; --surface2:#20395c; --line:#2d4a72;
  --ink:#eef2f7; --muted:#8ea3bf; --faint:#5d7391;
  --accent:#ffb23e; --good:#5fd49a; --mid:#ffd166; --bad:#ff6b6b; --great:#7cc4ff;
  --jp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --en:"Lexend","Segoe UI",system-ui,sans-serif;
  --disp:"Dela Gothic One","M PLUS Rounded 1c","Hiragino Sans",sans-serif;
  /* 役割の色（ゲーム全体で固定） */
  --cS:#7cc4ff; --cV:#ff8f8f; --cO:#8ee6a8; --cI:#6fe0d8; --cC:#ffb870; --cP:#d6a8ff; --cT:#ffd166; --cM:#e6ecf5; --cX:#9fb0c6;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:520px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}

.top{display:flex;align-items:center;gap:10px;padding-block:10px 0}
.logo{font-family:var(--disp);font-size:17px;white-space:nowrap}
.logo span{color:var(--accent)}
.meta{flex:1;display:flex;justify-content:flex-end;gap:12px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;align-items:baseline}
.meta b{color:var(--ink);font-family:var(--en);font-size:17px}
.gear{white-space:nowrap;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px}

/* 役割の色 */
.rS{color:var(--cS)} .rV{color:var(--cV)} .rO{color:var(--cO)} .rI{color:var(--cI)} .rC{color:var(--cC)}
.rP{color:var(--cP)} .rT{color:var(--cT)} .rM,.rR,.rF{color:var(--cM)} .rX{color:var(--cX)}
.strip .w.rS{color:var(--cS)} .strip .w.rV{color:var(--cV)} .strip .w.rO{color:var(--cO)} .strip .w.rI{color:var(--cI)} .strip .w.rC{color:var(--cC)} .strip .w.rP{color:var(--cP)} .strip .w.rT{color:var(--cT)} .strip .w.rM,.strip .w.rR,.strip .w.rF{color:var(--cM)} .strip .w.rX{color:var(--cX)}

/* 上：判定済みのチャンクと、流れ出た単語 */
.board{flex:1;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;overflow:hidden;padding:4px 2px}
.hist{font-family:var(--en);font-size:14px;line-height:1.7;opacity:.4}
.hist.newest{opacity:.85}
.line{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 4px;font-family:var(--en);font-size:20px;min-height:38px}
.pend{color:var(--muted);opacity:.7;line-height:1.5;padding-top:2px}
.blk{display:inline-flex;flex-direction:column;align-items:flex-start;border-radius:8px;padding:2px 6px 3px;background:rgba(255,255,255,.04);border:1px solid transparent;animation:blkIn .35s ease-out}
.blk .bw{line-height:1.4;white-space:normal}
.blk .bl{font-family:var(--jp);font-size:10px;font-weight:800;color:var(--muted);line-height:1.3;margin-top:1px}
.blk .bj{font-family:var(--jp);font-size:11px;font-weight:700;color:var(--ink);opacity:.8;line-height:1.3}
.blk.k-excellent{border-color:rgba(95,212,154,.45)} .blk.k-great{border-color:rgba(124,196,255,.45)}
.blk.k-good{border-color:rgba(255,209,102,.45)} .blk.k-miss,.blk.k-forgot{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.08)}
.blk.k-miss .w,.blk.k-forgot .w{color:var(--muted)}
.mk{display:inline-block;font-family:var(--jp);font-weight:800;font-size:13px;margin-right:4px;vertical-align:2px}
.mk.k-excellent{color:var(--good)} .mk.k-great{color:var(--great)} .mk.k-good{color:var(--mid)} .mk.k-mini{color:var(--cX)} .mk.k-miss,.mk.k-forgot{color:var(--bad)}
.cutmark{display:inline-block;color:var(--accent);font-weight:700;margin:0 .25em;opacity:.8}
.cutmark.forced{color:var(--bad)}
.bonus{display:inline-block;font-family:var(--jp);font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;margin:2px 4px 0 0;background:var(--surface2)}
.pts{font-family:var(--en);font-weight:700;font-size:15px;color:var(--accent);margin-left:6px}
.judgedLine{font-family:var(--en);font-size:18px;line-height:1.8;animation:blkIn .35s ease-out}
@keyframes blkIn{from{opacity:0;transform:translateY(8px)}}

/* 真ん中：レーン。区切り線は左寄りに固定 */
.laneWrap{position:relative;background:var(--surface);border-radius:14px;height:92px;overflow:hidden;flex:none}
.strip{position:absolute;left:0;top:50%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.strip.step{transition:transform var(--stepDur,.17s) cubic-bezier(.3,1.5,.5,1)}
.strip .w{font-family:var(--en);font-weight:700;font-size:var(--laneFont,20px);color:var(--ink);padding:0 .28em}
.strip .w.past{color:var(--muted)}
.strip .w.gone{opacity:.18}
.strip .w.next{color:var(--accent)}
.strip .w.eos{margin-right:0}
.strip .endmk{font-size:14px;color:var(--faint);padding:0 .5em 0 .15em}
.strip .w.done{opacity:.6}
.strip .cutmark{font-size:calc(var(--laneFont,20px)*1.3);margin:0;color:var(--accent);opacity:1;font-weight:700}
.strip .cutmark.forced{color:var(--bad)}
.cutline{position:absolute;top:10px;bottom:10px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px rgba(255,178,62,.6);z-index:2;pointer-events:none}
.cutline::before{content:attr(data-lbl);position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:var(--accent);white-space:nowrap}
.laneWrap.flash .cutline{animation:lineFlash .3s}
.ring{position:absolute;top:50%;width:84px;height:84px;border:3px solid;border-radius:50%;pointer-events:none;z-index:3;transform:translate(-50%,-50%)}
.spark{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:3;transform:translate(-50%,-50%)}
@keyframes lineFlash{50%{width:7px;margin-left:-3.5px;box-shadow:0 0 18px var(--accent)}}
.fadeL{position:absolute;left:0;top:0;bottom:0;width:30px;background:linear-gradient(90deg,var(--surface),transparent);pointer-events:none;z-index:1}
.fadeR{position:absolute;right:0;top:0;bottom:0;width:26px;background:linear-gradient(270deg,var(--surface),transparent);pointer-events:none;z-index:1}

/* 区切った瞬間の判定 */
.pop{position:fixed;transform:translateX(-50%);z-index:30;pointer-events:none;background:rgba(11,21,36,.94);border:1px solid var(--line);border-radius:12px;padding:6px 12px 7px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;max-width:240px;animation:popIn 1.5s ease-out forwards;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.pop b{font-family:var(--disp);font-weight:400;font-size:21px;line-height:1.2;white-space:nowrap}
.pop .pl{font-size:11px;font-weight:800;color:var(--muted);line-height:1.35}
.pop .pl2{font-size:10px;font-weight:700;color:var(--muted);line-height:1.3;opacity:.85}
.pop .pj{font-size:13px;font-weight:800;color:var(--ink);line-height:1.35}
.pop .pc{font-size:10px;font-weight:800;color:var(--accent);line-height:1.3}
.pop.k-excellent b{color:var(--good)} .pop.k-great b{color:var(--great)} .pop.k-good b{color:var(--mid)} .pop.k-mini b{color:var(--ink)} .pop.k-miss b,.pop.k-forgot b{color:var(--bad)}
@keyframes popIn{0%{opacity:0;transform:translate(-50%,10px) scale(.85)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}

/* 次の文：レーンと同じ大きさで、うっすら */
.preview{position:relative;height:40px;overflow:hidden;margin-top:-4px;flex:none}
.preview .pvStrip{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:var(--en);font-weight:700;font-size:var(--laneFont,20px);color:var(--ink);opacity:.22}
.preview .pvStrip .w{padding:0 .28em}
.preview::after{content:"";position:absolute;right:0;top:0;bottom:0;width:30px;background:linear-gradient(270deg,var(--bg),transparent)}

.scrub{width:100%;margin:0;height:26px;accent-color:var(--accent);touch-action:pan-x}
.ctrlRow{display:flex;gap:8px}
.navBtns{display:flex;gap:6px}
.navBtn{width:58px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);font-size:22px;font-weight:800;color:var(--ink);touch-action:manipulation}
.navBtn:active{background:var(--line)}
.navBtn:disabled{opacity:.3}
.titleScr{position:fixed;inset:0;z-index:70;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;background:linear-gradient(180deg,#bfe0fb 0%,#f3e6f5 55%,#fde3ee 100%);color:#4a3b5c;display:flex;flex-direction:column;align-items:center}
.tHero{width:100%;max-width:520px;height:34vh;min-height:220px;flex:none;position:relative;overflow:hidden}
.tHero img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.tLogoFb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-size:54px;line-height:1.05}
.tLogoFb .p{color:#ff9ec4;-webkit-text-stroke:2px #5a3a4a} .tLogoFb .b{color:#8cc8ff;-webkit-text-stroke:2px #34405a}
.tMenu{width:100%;max-width:460px;padding:0 16px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;margin-top:-18px;position:relative}
.tCard{background:rgba(255,255,255,.88);border-radius:22px;padding:12px 14px 12px;box-shadow:0 4px 0 rgba(160,130,190,.25),0 8px 20px rgba(120,100,160,.12);display:flex;flex-direction:column;gap:4px}
.tName{font-weight:800;font-size:19px;color:#5a4470;display:flex;align-items:center;gap:6px}
.tIco{font-size:20px}
.tDesc{font-size:12px;font-weight:700;color:#8a7a9c}
.tPlay{display:flex;gap:8px;margin-top:6px}
.tPlay button{flex:1;border:0;border-radius:999px;padding:10px 0;font-weight:800;font-size:15px;color:#fff;background:#ff9ec4;box-shadow:0 3px 0 #e07aa6}
.tPlay button.b{background:#8cc8ff;box-shadow:0 3px 0 #5ea6e6}
.tPlay button:active{transform:translateY(2px);box-shadow:none}
.tSet{align-self:center;border:0;background:rgba(255,255,255,.7);color:#6a5a7c;border-radius:999px;padding:8px 22px;font-weight:800;font-size:14px;margin-top:4px}
/* タイトル：GAME ⇔ STUDY */
.titleScr[data-face="none"] .faceGame,.titleScr[data-face="none"] .faceStudy{display:none}
.titleScr[data-face="game"] .faceNone,.titleScr[data-face="game"] .faceStudy{display:none}
.titleScr[data-face="study"] .faceNone,.titleScr[data-face="study"] .faceGame{display:none}
.titleScr[data-face="study"]{background:#07090e;color:#e8ecf2}
.titleScr[data-face="none"]{background:#07090e}
.faceNone{display:flex;width:100%;height:100%;min-height:100vh}
.half{flex:1;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.half b{font-size:28px}.half small{font-size:12px;font-weight:700;opacity:.7}.hArrow{font-size:30px}
.hGame{background:linear-gradient(180deg,#bfe0fb,#fde3ee);color:#5a4470;font-family:var(--jp);font-weight:800}
.hStudy{background:#07090e;color:#e8ecf2;font-family:var(--en);letter-spacing:.18em}
.faceGame,.faceStudy{width:100%;max-width:460px;min-height:100vh;box-sizing:border-box;padding:16px 16px 20px;display:flex;flex-direction:column;align-items:stretch;animation:faceIn .3s ease-out}
@keyframes faceIn{from{opacity:0;transform:translateY(8px)}}
.fSwitch{align-self:center;display:flex;background:rgba(255,255,255,.6);border-radius:999px;padding:3px}
.fSwitch button{border:0;background:transparent;border-radius:999px;padding:6px 16px;font-weight:800;font-size:12px;color:#8a7a9c}
.fSwitch button.on{background:#fff;color:#5a4470;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.fSwitch.s{background:transparent;border:1px solid #2a3140;border-radius:2px;padding:0}
.fSwitch.s button{border-radius:0;color:#6b7686;font-family:var(--en);letter-spacing:.12em}
.fSwitch.s button.on{background:#e8ecf2;color:#07090e;box-shadow:none}
.gLogo{display:flex;flex-direction:column;align-items:center;margin:9vh 0 7vh;font-family:var(--disp);font-size:52px;line-height:1.08}
.gLogo .p{color:#ff9ec4;-webkit-text-stroke:2px #fff;text-shadow:0 4px 0 #e889b2,0 8px 18px rgba(232,137,178,.35)}
.gLogo .b{color:#8cc8ff;-webkit-text-stroke:2px #fff;text-shadow:0 4px 0 #5ea6e6,0 8px 18px rgba(94,166,230,.35)}
.gMenu{display:flex;flex-direction:column;gap:12px}
.fHint{margin:auto 0 0;padding-top:18px;text-align:center;font-size:11px;font-weight:700;opacity:.55}
.sLogo{margin:10vh 0 6px;font-family:var(--en);font-weight:700;font-size:44px;letter-spacing:.2em;line-height:1.1;text-align:center}
.sSub{text-align:center;font-family:var(--en);font-size:10px;letter-spacing:.35em;color:#6b7686;margin-bottom:8vh}
.sMenu{display:flex;flex-direction:column;border-top:1px solid #1d2430}
.sMenu button{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;text-align:left;background:transparent;border:0;border-bottom:1px solid #1d2430;padding:14px 4px;color:#e8ecf2}
.sMenu b{font-family:var(--en);font-weight:600;font-size:17px;letter-spacing:.04em}
.sMenu small{grid-column:1;font-size:11px;color:#6b7686;margin-top:2px}
.sMenu i{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;color:#6b7686}
.sMenu button:active{background:#10141c}
/* My Texts */
.edView{position:fixed;inset:0;z-index:66;background:#07090e;color:#e8ecf2;overflow:auto;padding:0 16px 30px;box-sizing:border-box}
.edBody{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.edBody input[type=text],.edBody textarea{width:100%;box-sizing:border-box;background:#0f141d;border:1px solid #232b38;border-radius:4px;color:#e8ecf2;padding:9px;font:inherit;font-family:var(--en)}
.edBody textarea{min-height:120px;line-height:1.5}
.edBody h3{margin:8px 0 0;font-size:12px;letter-spacing:.12em;color:#6b7686;font-family:var(--en)}
.edBtn{background:#161c27;border:1px solid #2a3344;border-radius:4px;color:#e8ecf2;padding:10px 12px;font-weight:700;font-size:13px}
.edBtn.pri{background:#e8ecf2;color:#07090e;border-color:#e8ecf2}
.edBtn.del{color:#ff8f8f}
.edRow{display:flex;gap:8px;flex-wrap:wrap}
.edItem{border:1px solid #1d2430;border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:6px}
.edItem b{font-size:15px}.edItem small{color:#6b7686;font-size:11px}
.edSent{border-top:1px solid #1d2430;padding-top:8px;display:flex;flex-direction:column;gap:6px}
.edWords{display:flex;flex-wrap:wrap;align-items:center;row-gap:8px;font-family:var(--en);font-size:15px}
.edW{padding:0 1px}
.edGap{border:0;background:transparent;color:#2f3848;width:14px;padding:0;font-size:16px;font-weight:700;cursor:pointer}
.edGap.on{color:var(--accent)}
.roleChip{border:0;border-radius:3px;font-size:10px;font-weight:800;padding:2px 5px;margin-right:3px;background:#1b2230;cursor:pointer;font-family:var(--en)}
.edStatus{font-size:12px;color:#9aa6b8;min-height:16px}
.edCopy{border:1px solid #232b38;border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.edCopy summary{cursor:pointer;font-weight:700;font-size:13px}
.edCopy[open]{display:flex}
.edCopy>*+*{margin-top:8px}
.edSteps{margin:0;padding-left:20px;font-size:12px;color:#9aa6b8;line-height:1.7}
.edBody #edPaste{min-height:90px;font-size:12px}
.edBody #edPrompt{min-height:220px;font-size:12px;line-height:1.6;font-family:var(--jp);color:#c9d2de}
.edQ{border:1px solid #1d2430;border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.edQ select{background:#0f141d;color:#e8ecf2;border:1px solid #232b38;border-radius:4px;padding:6px;font:inherit}
.choiceRow{display:flex;gap:6px;align-items:center}
.spanPick{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border-left:2px solid #2a3344;padding-left:6px}
.spanPick select{max-width:46%;font-size:12px}
.spPrev{width:100%;font-family:var(--en);font-size:13px;color:var(--good)}
.edSet label{font-size:12px;color:#9aa6b8;display:flex;align-items:center;gap:4px}
.edSet select{background:#0f141d;color:#e8ecf2;border:1px solid #232b38;border-radius:4px;padding:5px;font:inherit}
/* 役割を答える */
.rolePick{position:fixed;z-index:35;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:360px;transform:translateX(-50%)}
.rolePick button{border:1px solid #2a3344;background:#0f141d;border-radius:4px;padding:7px 9px;font-family:var(--en);font-weight:700;font-size:12px}
/* 5択 */
.rdChoices{display:flex;flex-direction:column;gap:6px}
.spanView{font-size:15px;line-height:1.9}
.spw{padding:1px 0}
.spE{background:rgba(95,212,154,.25);border-radius:3px}
.spM{border-bottom:3px solid var(--accent)}
.legendSp{font-size:11px;color:var(--muted)}
.why{color:var(--muted);font-size:12px;margin-left:4px}
.rdChoices button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink)}
.rdChoices button.on{border-color:var(--accent);background:var(--surface2)}
/* みっけ！チャンク */
.readView{position:fixed;inset:0;z-index:65;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding:0 16px 14px;box-sizing:border-box;max-width:520px;margin:0 auto;user-select:none;-webkit-user-select:none;overflow:auto}
.rdStory{flex:1;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdHintBtn{color:var(--mid)}
.rdQ{touch-action:pan-y;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px}
.rdQText{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.rdQNum{font-size:11px;font-weight:800;color:var(--accent)}
.rdQText b{font-size:16px;line-height:1.4}
.rdAns{font-size:12px;color:var(--muted);font-family:var(--en)}
.qNav{width:34px;height:44px;border:0;background:transparent;font-size:26px;color:var(--muted);flex:none}
.rdCtx{font-family:var(--en);font-size:14px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:20px;padding:0 4px}
.rdLane{touch-action:none;cursor:grab}
.rdGest{flex:1 1 auto;display:flex;flex-direction:column;gap:8px;touch-action:none;min-height:0}
.rdPad{flex:1 1 auto;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px;position:relative;touch-action:none;cursor:grab;border:1.5px dashed var(--line);border-radius:16px;padding:8px 6px;overflow:hidden}
